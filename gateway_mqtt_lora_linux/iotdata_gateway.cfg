# -------------------------------------------------------------------------
# iotdata gateway configuration (defaults)
# -------------------------------------------------------------------------

# lora E22-900T22U (serial)
lora-port=/dev/e22900t22u
lora-address=0xFFFF
lora-network=0x08
lora-channel=0x0A
lora-crypt=0x0000
lora-packet-size=240
lora-air-rate=2400
lora-tx-power=22
lora-lbt=true

# mqtt broker
mqtt-client=iot_gwy_01
mqtt-server=mqtt://localhost:1883
mqtt-topic-prefix=iotdata
mqtt-tls-insecure=false
mqtt-reconnect-delay=5
mqtt-reconnect-delay-max=60
mqtt-debug=false

# iotdata mesh
mesh-enable=true
# the station this gateway answers as. A SETTING, not a config row: commissioning over the
# air writes it here. Remove the line to let it derive from this machine's MAC instead.
node-station=1
mesh-beacon-interval-s=60
mesh-debug=false

# iotdata ddup
ddup-enable=true
ddup-port=9876
ddup-peers=192.168.0.2:9876,192.168.0.3:9876
ddup-delay=20
ddup-debug=false

# stat
stat-display-interval=300
stat-publish-interval=300
stat-display-mesh-interval=300
stat-publish-mqtt-topic-prefix=iotdata/stats

# debug
debug=false
