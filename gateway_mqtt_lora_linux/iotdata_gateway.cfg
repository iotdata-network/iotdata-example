# -------------------------------------------------------------------------
# iotdata gateway configuration (defaults)
#
# Every row this build has. `--help` prints the same list with each row's type,
# range and default, and `--<name> <value>` sets any of them for one run.
#
# PRECEDENCE: this file, then the overlay a runtime change is written to (named
# by --overlay), then the command line. A name this build does not know is
# reported at startup and skipped -- so a row renamed in the code shows up as an
# error line here rather than as a silently applied default.
# -------------------------------------------------------------------------

# process
state=/var/lib/iotdata
debug=false

# lora E22-900T22U (serial)
lora-port=/dev/e22900t22u
lora-address=0xFFFF
lora-network=0x08
lora-channel=0x0F
lora-crypt=0x0000
lora-packet-size=240
lora-packet-rate=2400
lora-transmit-power=22
lora-lbt=true
lora-debug=false

# iotdata node
node-station=1

# iotdata diag (blackbox)
blackbox-enabled=true
blackbox-max-records=0
blackbox-max-seconds=0
blackbox-max-bytes=0
blackbox-file-directory=/var/lib/iotdata
blackbox-file-generations=10

# iotdata content
content-enabled=true
content-file-directory=/var/lib/iotdata
content-file-max-bytes=0

# iotdata mesh
mesh-enable=true
mesh-beacon-interval-s=60
mesh-debug=false

# iotdata ddup
ddup-enable=true
ddup-port=9876
ddup-peers=mqtt
ddup-delay-ms=20
ddup-hold-ms=1000
ddup-debug=false
#ddup-debug-inject-latency-ms=0

# mqtt broker
mqtt-client=iot_gwy_001
mqtt-server=mqtt://localhost:1883
mqtt-topic-prefix=iotdata
mqtt-tls-insecure=false
mqtt-reconnect-delay-s=5
mqtt-reconnect-delay-s-max=60
mqtt-debug=false

# stat
stat-display-interval-s=300
stat-display-netw-interval-s=300
stat-publish-interval-s=300
stat-publish-netw-interval-s=900
stat-publish-mqtt-topic-prefix=iotdata/stats
