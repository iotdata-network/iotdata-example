# -------------------------------------------------------------------------
# iotdata gateway monitor configuration (defaults)
# -------------------------------------------------------------------------

# web server
web-port=80
web-bind=0.0.0.0

# mqtt broker (subscribed via the mqtt module)
mqtt-server=localhost
mqtt-port=1883
mqtt-topic=iotdata/#
# mqtt-accept    topic kinds taken from the subscription, comma separated: station
#                (<prefix>/variant/<name>/<station-hex>), or the segment naming others:
#                `from` for a management report, `gateway` or `network` for a stats document
mqtt-accept=station

# history and statistics
# history-keep   packets retained for replay to a browser that connects late
# stats-window   packets over which interval and average rssi are computed; small enough
#                to track conditions as a station is moved, large enough to be steady
# stats-max-gap  a sequence jump beyond this is a station restart or counter wrap, not
#                loss; counting it would peg the loss figure at ~100% after one reboot
history-keep=500
stats-window=20
stats-max-gap=1000
# stats-dup-window  seconds within which a station's sequence number seen again counts as a
#                   duplicate (the same packet delivered twice, which ddup should prevent)
stats-dup-window=300
# stats-battery-stale  hours after which a station's last battery reading shows as stale (red)
stats-battery-stale=24
# stats-relay-stale  seconds after which a relay unheard shows as stale: three beacon rounds
stats-relay-stale=450

# base station: the gateway's own surveyed position, from which distances are measured.
# Matches ref_latitude/ref_longitude/ref_altitude in the packet forwarder's global_conf.
# Without these, packets are still shown but carry no distance.
#ref-latitude=0.0
#ref-longitude=0.0
#ref-altitude=0

# -------------------------------------------------------------------------
# stations: station-<ID>-name / -latitude / -longitude / -altitude / -state / -host
#
# ID is the hex station id as it appears in the mqtt topic. Name alone is enough;
# a station without a position simply shows no distance. State is free text with a
# column of its own (deployed, broken, needs_upgrade, ...). Host is the machine the
# station hangs off, and makes its name an ssh:// link to it (user@host works too)
# for whatever handler the viewing machine has for ssh://. Stations not listed here
# are still displayed, by id -- unless ignore-unspecified is true, which ignores them,
# live and on restore, so one that does not belong drops out at the next restart.
# Each ignored station is logged once.
ignore-unspecified=false
# -------------------------------------------------------------------------

#station-0000-name=example station
#station-0000-latitude=0.0
#station-0000-longitude=0.0
#station-0000-state=deployed
#station-0000-host=example.local

# -------------------------------------------------------------------------
# decoder plugins: decoder-<name>=<path to a node module>
#
# The module must export decodeMonitor(body), returning display fields or null when
# the packet is not its own; a summary, if it returns one, is what the station table
# shows in its reading column. Loaded by path and never referenced by this repo, so a
# device-specific wire format can be shown here without the monitor depending on that
# device's code — and a host without the plugin simply logs it and carries on.
#
# Bind a station to one with station-<ID>-decoder=<name>; unbound, every loaded
# decoder is offered each packet and the first to claim it wins.
# -------------------------------------------------------------------------

#decoder-tsa=/path/to/iotdata-device/tsa/test_esp32c3/scripts/lora_mqtt_decode.js
#station-0000-decoder=tsa

# -------------------------------------------------------------------------
# packet log: one JSON object per line (JSON Lines), every packet, appended.
# Unset means no logging. log-flush-interval is how often buffered records are
# written to disk, NOT a sampling rate — batching spares the SD card a constant
# trickle of tiny appends. The buffer is bounded, so an unwritable filesystem
# costs memory that is capped rather than unbounded.
# -------------------------------------------------------------------------

#log-file=/opt/storage/packets.json
#log-flush-interval=300

# -------------------------------------------------------------------------
# state snapshot
#
# The station table is accumulated over days and lives only in memory, so without
# this a restart wipes it — including the stations that have gone quiet, which are
# the ones worth noticing. Saved to tmpfs rather than the card, since it is
# rewritten every interval; rebuilt by streaming log-file whenever tmpfs is empty,
# which is every reboot. Costs a second or two of delayed subscription at startup.
# -------------------------------------------------------------------------
snapshot-file=/dev/shm/iotdata-gateway-monitor.state
snapshot-interval=60

# -------------------------------------------------------------------------
# gnss tracker (optional; off unless tracker-host is set)
#
# A LoRaWAN GNSS tracker followed through its network server's MQTT feed rather
# than through this site's own gateway: carry it to a candidate spot, press the
# button, and the position lands behind the [#N] button in the title bar next to
# the RSSI the local stations are producing. Positions are deduplicated — a
# confirmed uplink is repeated until acknowledged, so one press arrives two or
# three times — and the strongest reception of each is the one kept.
#
# tracker-type      wire format: sensecap-t1000b
# tracker-tls       on by default for port 8883, off otherwise; set true/false to force
# tracker-cafile    extra CA bundle, only needed when the server's chain is not in node's
#                   built-in store; certificate verification is on regardless
# tracker-keep      positions held in memory and in the snapshot
# tracker-show      positions the panel lists
#
# tracker-pass is a network server API key. Install this file mode 600 when it is
# set (the Makefile does). The key never reaches `ps`: the monitor speaks MQTT
# itself and passes the credential in the CONNECT packet.
# -------------------------------------------------------------------------
#tracker-type=sensecap-t1000b
#tracker-host=eu1.cloud.thethings.network
#tracker-port=8883
#tracker-cafile=/etc/ssl/certs/ca-certificates.crt
#tracker-user=<application-id>@<tenant>
#tracker-pass=<api-key>
#tracker-topic=#
#tracker-keep=200
#tracker-show=16
#tracker-log-file=/opt/storage/<site>-gnss.json
#tracker-log-flush-interval=60

# -------------------------------------------------------------------------
# map: a Google Maps view of the gateway, the stations and the tracker track,
# at /map, linked as [map] in the page header. Without a key there is no link
# and no map; everything else works unchanged.
#
# A Maps JavaScript API key is public by nature -- the browser presents it, so
# it is served inside the page. Protect it by restriction rather than secrecy:
# in the Cloud console limit it to the Maps JavaScript API and to the referrers
# you serve from. Keep the real key in the per-host config, not in this file.
#
# map-type is hybrid by default: on a survey the tree line and rooflines matter
# more than the road layer, which hybrid keeps drawn on top anyway. roadmap,
# satellite and terrain are the alternatives. map-zoom applies only when there
# is a single point to show -- with more, the view fits them.
# -------------------------------------------------------------------------
#map-api-key=<browser-key>
#map-type=hybrid
#map-zoom=17
